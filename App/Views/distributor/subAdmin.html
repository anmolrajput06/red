<!-- Main Content -->

            <h1>Sub Admin Table</h1>

                <li><a href="/dashboard"><i class="fa fa-dashboard"></i> Dashboard</a></li>
                <li class="active">Sub Admin</li>
            </ol>
        </section>
        <!-- /Title -->
         
        <br>

</div>
<section class="content">
    <!-- Row -->
    <div class="row">
        <!-- /.modal -->
        <div id="responsive-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true" style="display: none;">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form method="POST" name="addDeductChips" action="/addDeductChipsSubAdmin">
                        <div class="modal-header">
                            <button type="button" class="close" data-dismiss="modal" aria-hidden="true">×</button>
                            <h5 class="modal-title">Add/Deduct Coins</h5>
                        </div>
                        <div class="modal-body">
                            <div id="chipsAdd"> </div>
                            <div class="form-group">
                                <label for="chips" class="control-label mb-10">Chips:</label>
                                <input type="text" name="chips" class="form-control" id="chips" required>
                            </div>
                            <div class="form-group">
                                <label for="chipsNote" class="control-label mb-10">Chips Note:</label>
                                <input type="text" name="chipsNote" class="form-control" id="chipsNote" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <input type="submit" name="chipsValue" class="btn btn-success" value="Add">
                            <input type="submit" class="btn btn-danger" name="chipsValue" value="Deduct">
                        </div>
                    </form>
                   
                </div>
            </div>
           
        </div>
        <!-- Button trigger modal -->
     

    </div>
    <!-- /Row -->
</section>
{% endblock %} {% block Jscript %}
<script>
    $(document).ready(function() {
        var host = window.location.origin;
        console.log(window.location.url);
        let dataTable = $('#myTable').DataTable({
            "oLanguage": {
                "sSearch": "Search Username"
            },
            // "scrollX": true,
            // "searching": false,
            "processing": true,
            "serverSide": true,
            "ordering": false,
            "autoWidth": false,
            "pageLength": 25,
            "ajax": {
                url: host + '/subAdmin/getSubAdmin',
                data: function(data) {
                    var status = $('#status').val();
                    data.status = status
                }
            },
            "columns": [{
                "data": "_id",
                render: function(data, type, row, meta) {
                    return meta.row + meta.settings._iDisplayStart + 1;
                }
            }, {
                "data": "name"
            }, {
                "data": "email"
            }, {"data":"chips"},{
                "data": "image",
                render: function(data, row, type) {
                    return '<img src="' + type.image + '"width="50px" height="50px">';
                }
            }, {
                "data": "status"
            }, {
                "data": "action",
                render: function(data, type, row) {
                    return '<a href="/subAdminEdit/' + row.id + '"><button type="button" class="btn btn-warning btn-xs btn-rounded" name="edit" value="block" title="Block Player"><i class="fa fa-edit" aria-hidden="true"></i></button></a> <button type="button" title="Delete Player" name="delete" id="' + row.id + '" class="btn btn-danger btn-xs btn-rounded delete"><i class="fa fa-trash" aria-hidden="true"></i></button> <a data-toggle="modal" data-target="#responsive-modal" href="#" ><button type="button" id="' +  row.id + '" class="btn btn-success btn-xs btn-rounded addChips" name="add" title="Add/Deduct Chips"><i class="fa fa-usd" aria-hidden="true"></i> </button></a>'
                        // return '<a href="/userEdit/'+row.id+'"><button type="button" class="btn btn-warning btn-xs" name="edit"><i class="fa fa-edit" aria-hidden="true"></i></button></a> <button type="button" name="delete" id="'+row.id+'" class="btn btn-danger btn-xs delete"><i class="fa fa-trash" aria-hidden="true"></i></button> '
                        // <a href="/userEdit/' + row.id + '"><button type="button" class="btn btn-warning btn-xs btn-rounded" name="edit"><i class="fa fa-edit" aria-hidden="true"></i></button></a> <button type="button" name="delete" id="' + row.id + '" class="btn btn-danger btn-xs delete btn-rounded"><i class="fa fa-trash" aria-hidden="true"></i></button>
                }
            }]
        });
        $('#status').on('change', function() {
            console.log("yess it chaneg ");
            dataTable.draw();
        });


        $(function() {
            "use strict";

            var SweetAlert = function() {};

            SweetAlert.prototype.init = function() {

                    //Parameter
                    $('body').on('click', '.delete', function(e) {
                        var id = $(this).attr('id');
                        var thisElement = this;
                        swal({
                            title: "Are you sure?",
                            text: "You will not be able to recover this User!",
                            type: "warning",
                            showCancelButton: true,
                            confirmButtonColor: "#e69a2a",
                            confirmButtonText: "Yes, delete it!",
                            cancelButtonText: "No, cancel plx!",
                            closeOnConfirm: false,
                            closeOnCancel: false
                        }, function(isConfirm) {
                            if (isConfirm) {
                                $.ajax({
                                    type: 'POST',
                                    url: host + "/user/getUserDelete",
                                    data: {
                                        id: id
                                    },
                                    success: function(resultData) {
                                        // alert(resultData)
                                        console.log(resultData);
                                        if (resultData == 'success') {
                                            // $(thisElement).parent().parent().hide(700);
                                            swal("Deleted!", "Your imaginary file has been deleted.", "success");
                                            window.location.reload()
                                        } else {
                                            alert("Something went wrong")
                                        }
                                        // alert("Save Complete")
                                    }
                                });
                                swal("Deleted!", "User Deleted Succesfully.", "success");
                            } else {
                                swal("Cancelled", "User Not Deleted)", "error");
                            }
                        });
                        return false;
                    });
                },
                $.SweetAlert = new SweetAlert, $.SweetAlert.Constructor = SweetAlert;

            $.SweetAlert.init();
        });
        $("body").on("click", ".addChips", function() {
            var userId = $(this).attr("id");
            console.log("userId",userId)
            var html = '<input type="hidden" name="userId" value="' + userId + '" />';
            $("#chipsAdd").html(html);
        });
    });
</script>
{% endblock %}
