{% extends "partition/layout.html" %}


{% block body %}


<!-- Main Content -->
<div class="page-wrapper">
	<div class="container-fluid">

		<!-- Title -->
		<section class="content-header">
			<h1>Maintenance </h1>
			<ol class="breadcrumb">
				<li><a href="#"><i class="fa fa-dashboard"></i> Dashboard</a></li>
				<li class="active"><span>Edit Maintenance/span></li>
			</ol>
		</section>
		<!-- /Title -->
		 
		<!-- Row -->
		<section class="content">
			<div class="row">
				<div class="col-sm-12">
					<div class="panel panel-default card-view">
						<div class="panel-heading">
							<div class="pull-left">
								<h6 class="panel-title txt-dark">Edit Maintenance</h6>
							</div>
							<div class="clearfix"></div>
						</div>
						<div class="panel-wrapper collapse in">
							<div class="panel-body">
								<div class="table-wrap">
									<div class="table-responsive">
										<form method="POST" action="/maintenance/edit/{{setting._id}}" class="form-horizontal">
											<table border="0" class="table display  pb-30">
												<div class="col-sm-6">
													<div class="panel-wrapper collapse in">
														<div class="panel-body">
															<div class="form-group">
																<label class="control-label mb-10 col-sm-4" for="message">Message</label>
																<div class="col-sm-8">
																	<input required="required" class="form-control"placeholder="Message"  name="message" type="text" id="" value="{{setting.maintenance.message}}">
																</div>
															</div>

															<div class="form-group">
																<label class="control-label mb-10 col-sm-4" for="showBeforeMinutes">Display Message Before(in minutes)</label>
																<div class="col-sm-8">
																	<input required="required" class="form-control" placeholder="shoe Message Before"   name="showBeforeMinutes" type="number" id="showBeforeMinutes" autocomplete="off" value="{{setting.maintenance.showBeforeMinutes}}">
																</div>
															</div>


															<div class="form-group">
																<label class="control-label mb-10 col-sm-4" for="maintenance_start_date">Maintenance Start Date/Time</label>
																<div class="col-sm-8"> 
																	<input required="required" class="form-control" placeholder="Date And Time"   name="maintenance_start_date" type="text" id="maintenance_start_date" autocomplete="off"
																	data-date-format="YYYY-MM-DD HH:mm" value="{{maintenance_start_date}}">
																</div>
															</div>

															<div class="form-group">
																<label class="control-label mb-10 col-sm-4" for="maintenance_end_date">Maintenance End Date/Time</label>
																<div class="col-sm-8"> 
																	<input required="required" class="form-control" placeholder="Date And Time"   name="maintenance_end_date" type="text" id="maintenance_end_date" autocomplete="off"
																	data-date-format="YYYY-MM-DD HH:mm" value="{{maintenance_end_date}}">
																</div>
															</div>

															<div class="form-group">
																<label class="control-label mb-10 col-sm-4" for="status">Status:</label>
																<div class="col-sm-8"> 
																	<select class="form-control" name="status" id="status">
																		<option value="inactive" {{ "selected" if setting.maintenance.status=='inactive' else "" }} >Inactive</option>
																		<option value="active" {{ "selected" if setting.maintenance.status=='active' else "" }} >Active</option>
																	</select>
																</div>
															</div>
	
																	
														</div>
													</div>
												</div>
												
												<tr>
													<td colspan="2" >
														<div class="pull-left">
														<input type="submit" class="btn    btn-flat  btn-success " value="Submit">
														<a href="/maintenance" class="btn btn-danger btn-flat">Cancel</a>
															</div>
													</td>
												</tr>
											</table>
										</form>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<!-- /Row -->
			</div>
		</section>	

	{% endblock %}

	{% block Jscript %}
	<script>
		$(document).ready( function () {
			$('#maintenance_start_date, #maintenance_end_date').datetimepicker();
			var host = window.location.origin;
		} );
	</script>


	{% endblock %}
