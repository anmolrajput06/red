{% extends "partition/layout.html" %} {% block body %}


<!-- Main Content -->
<div class="page-wrapper">
    <div class="container-fluid">

        <!-- Title -->
        <section class="content-header">
            <h1>Grand Master Table</h1>
            <ol class="breadcrumb">
                <li><a href="/myPlayer"><i class="fa fa-users"></i> Player</a></li>
                <li class="active">Grand Master</li>
            </ol>
        </section>
        <!-- /Title -->
         
        <!-- Row -->
        <section class="content">
            <div class="row">
                <div class="col-sm-12">
                    <div class="panel panel-default card-view">
                        <div class="panel-heading">
                            <div class="pull-left">
                                <h6 class="panel-title txt-dark">Grand Master</h6>
                            </div>
                            {%if roleData[0] != null%}
                            <div class="pull-right">
                                <a href="/grandMaster/addGrandMaster"><button type="button" class="btn btn-primary btn-md"><i class="fa fa-plus"></i> Add Grand Master</button></a>
                            </div>
                            {%endif%}
                            <div class="clearfix"></div>
                        </div>
                        <div class="panel-wrapper collapse in">
                            <div class="panel-body">
                                <div class="table-wrap">
                                    <div class="table-responsive">
                                        <table id="myTable" class="table table-hover display  pb-30">
                                            <thead>
                                                <tr>
                                                    <th>Name</th>
                                                    <th>Email</th>
                                                    <th>Total Chips</th>
                                                    <th>Commission</th>
                                                    <th>Total Commission</th>
                                                    <th>Action</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
<section class="content">
    <!-- Row -->
    <div class="row">
        <!-- /.modal -->
        <div id="responsive-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true" style="display: none;">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form method="POST" name="addDeductChips" action="/addDeductChipsGrandMaster">
                        <div class="modal-header">
                            <button type="button" class="close" data-dismiss="modal" aria-hidden="true">×</button>
                            <h5 class="modal-title">Add/Deduct Coins</h5>
                        </div>
                        <div class="modal-body">
                            <div id="chipsAdd"> </div>
                            <div class="form-group">
                                <label for="chips" class="control-label mb-10">Chips:</label>
                                <input type="text" name="chips" class="form-control" id="chips" required>
                            </div>
                            <div class="form-group">
                                <label for="chipsNote" class="control-label mb-10">Chips Note:</label>
                                <input type="text" name="chipsNote" class="form-control" id="chipsNote" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <input type="submit" name="chipsValue" class="btn btn-success" value="Add">
                            <input type="submit" class="btn btn-danger" name="chipsValue" value="Deduct">
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <!-- Button trigger modal -->
    </div>
    <!-- /Row -->
</section>

{% endblock %} {% block Jscript %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.3/jquery.validate.min.js" integrity="sha512-37T7leoNS06R80c8Ulq7cdCDU5MNQBwlYoy1TX/WUsLFC2eYNqtKlV0QjH7r8JpG/S0GUMZwebnVFLPd6SU5yg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
    $(document).ready(function() {
        var host = window.location.origin;
        console.log(window.location.url);
        $('#myTable').DataTable({
            "oLanguage": {
                "sSearch": "Search Username"
            },
            // "scrollX": true,
            // "searching": false,
            "processing": true,
            "serverSide": true,
            "ordering": false,
            "autoWidth": false,
            "pageLength": 25,
            "ajax": host + '/grandMaster/getGrandMaster',
            "columns": [
                // { "data": "_id" },
                {
                    "data": "name",
                    render: function(data, type, row) {
                        console.log(row);
                        return '<a href="/masterPlayerList/' + row.id + '">' + data + '</a>'
                    }
                }, {
                    "data": "email"
                }, {
                    "data": "chips",
                    render: function(data){
                        return parseFloat(data).toFixed(2)
                    }
                }, {
                    "data": "totalCommission",
                    render: function(data, type, row) {
                        return parseFloat(data).toFixed(2) + ' %'
                    }
                },
                {
                    "data": "commission",
                    render: function(data, type, row) {
                        return parseFloat(data).toFixed(2) + ' %'
                    }
                },
                // { "data": "email" },
                // {
                // 	"data": "image",
                // 	render : function(data, type, row){
                // 		return '<img height="100px" src="'+row.image+'"></img>'
                // 	}
                // },

                {
                    "data": "action",
                    render: function(data, type, row) {
                        return '<div class="dropdown"><button type="button" class="btn btn-primary dropdown-toggle" data-toggle="dropdown">Action</button><div class="dropdown-menu">{%if roleData[1]!=null%}<a class="dropdown-item" href="/grandMaster/grandMasterEdit/' + row.id + '">Edit Grand Master</a><br>{%endif%}{%if roleData[4] != null%}<a data-toggle="modal" data-target="#responsive-modal" href="#" class="addChips" id="' + row.id + '" title="Add Chips">Add/Deduct Chips</a><br>{%endif%}<a class="dropdown-item edit" href="#" id="' + row.id + '">' + row.status + '</a><br>{%if roleData[2] != null%}<a class="dropdown-item delete" href="#" id="' + row.id + '" >Delete Grand Master</a>{%endif%}</div></div>'
                            // return '<a href="/userEdit/'+row.id+'"><button type="button" class="btn btn-warning btn-xs" name="edit"><i class="fa fa-edit" aria-hidden="true"></i></button></a> <button type="button" name="delete" id="'+row.id+'" class="btn btn-danger btn-xs delete"><i class="fa fa-trash" aria-hidden="true"></i></button> '
                            // <a href="/siteOwner/userEdit/' + row.id + '"><button type="button" class="btn btn-warning btn-xs btn-rounded" name="edit"><i class="fa fa-edit" aria-hidden="true"></i></button></a> <button type="button" name="delete" id="' + row.id + '" class="btn btn-danger btn-xs delete btn-rounded"><i class="fa fa-trash" aria-hidden="true"></i></button>
                    }
                }
            ]
        });

        $(function() {
            "use strict";

            var SweetAlert = function() {};

            SweetAlert.prototype.init = function() {

                    //Parameter
                    $('body').on('click', '.delete', function(e) {
                        var id = $(this).attr('id');
                        var thisElement = this;
                        swal({
                            title: "Are you sure?",
                            text: "You will not be able to recover this User!",
                            type: "warning",
                            showCancelButton: true,
                            confirmButtonColor: "#e69a2a",
                            confirmButtonText: "Yes, delete it!",
                            cancelButtonText: "No, cancel plx!",
                            closeOnConfirm: false,
                            closeOnCancel: false
                        }, function(isConfirm) {
                            if (isConfirm) {
                                $.ajax({
                                    type: 'POST',
                                    url: host + "/user/getUserDelete",
                                    data: {
                                        id: id
                                    },
                                    success: function(resultData) {
                                        // alert(resultData)
                                        console.log(resultData);
                                        if (resultData == 'success') {
                                            // $(thisElement).parent().parent().hide(700);
                                            swal("Deleted!", "Your imaginary file has been deleted.", "success");
                                            window.location.reload()
                                        } else {
                                            alert("Something went wrong")
                                        }
                                        // alert("Save Complete")
                                    }
                                });
                                swal("Deleted!", "User Deleted Succesfully.", "success");
                            } else {
                                swal("Cancelled", "User Not Deleted)", "error");
                            }
                        });
                        return false;
                    });
                    $('body').on('click', '.edit', function(e) {
                        var id = $(this).attr('id');
                        var thisElement = this;
                        swal({
                            title: "Are you sure?",
                            // text: "",
                            type: "warning",
                            showCancelButton: true,
                            confirmButtonColor: "#e69a2a",
                            confirmButtonText: "Yes, edit it!",
                            cancelButtonText: "No, cancel pls!",
                            closeOnConfirm: false,
                            closeOnCancel: false
                        }, function(isConfirm) {
                            if (isConfirm) {
                                $.ajax({
                                    type: 'POST',
                                    url: host + "/editGrandMasterStatus",
                                    data: {
                                        id: id
                                    },
                                    success: function(resultData) {
                                        // alert(resultData)
                                        console.log(resultData);
                                        if (resultData == 'success') {
                                            swal("Updated!", "Your Status Updated.", "success");
                                            window.location.reload()
                                        } else {
                                            alert("Something went wrong")
                                        }
                                        // alert("Save Complete")
                                    }
                                });
                                swal("Update!", "User Updated Successfully.", "success");
                            } else {
                                swal("Cancelled", "User Not Updated)", "error");
                            }
                        });
                        return false;
                    });

                },
                $.SweetAlert = new SweetAlert, $.SweetAlert.Constructor = SweetAlert;

            $.SweetAlert.init();
        });
        $("body").on("click", ".addChips", function() {
            var userId = $(this).attr("id");
            console.log(userId)
                // console.log("player id ----------->",PlayerId)
            var html = '<input type="hidden" name="userId" value="' + userId + '" />';
            $("#chipsAdd").html(html);
        });
    });
</script>
{% endblock %}
