{% extends "partition/layout.html" %} {% block body %}


<!-- Main Content -->
<div class="page-wrapper">
    <div class="container-fluid">

        <!-- Title -->
        <section class="content-header">
            <h1>Games Management</h1>
            <ol class="breadcrumb">
                <li><a href="/"><i class="fa fa-dashboard"></i> Dashboard</a></li>
                <!-- <li><a href="/gameMaster">Slot Game Master</a></li> -->
                <li class="active">Games Management</li>
            </ol>
        </section>
        <!-- /Title -->
         
        <!-- Row -->
        <section class="content">
            <div class="row">
                <div class="col-sm-12">
                    <div class="panel panel-default card-view">
                        <div class="panel-heading">
                            <!-- <div class="pull-left">
                                <h6 class="panel-title txt-dark">Theme Master</h6>
                            </div> -->
                            <div class="pull-right">
                                <a href="/games/addGame/"><button type="button" class="btn btn-primary btn-md"><i class="fa fa-plus"></i> Add Game</button></a>
                            </div>
                            <div class="clearfix"></div>
                        </div>
                        <div class="panel-wrapper collapse in">
                            <div class="panel-body">
                                <div class="table-wrap">
                                    <div class="table-responsive">
                                        <table id="myTable" class="table table-hover display pb-30">
                                            <thead>
                                                <tr>
                                                    <th>Id</th>
                                                    <th>Theme Name</th>
                                                    <th>Theme Backgound</th>
                                                    <th>Theme Icon</th>
                                                    <th>Reel Backgound</th>
                                                    <th>Reel Frame</th>
                                                    <th>Modify</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>

{% endblock %} {% block Jscript %}
<script>
    $(document).ready(function() {
        var host = window.location.origin;
        var gameId = $("#gameId").val();
        $('#myTable').DataTable({
            "oLanguage": {
                "sSearch": "Search Game"
            },
            // "scrollX": true,
            // "searching": false,
            "processing": true,
            "serverSide": true,
            "ordering": false,
            "autoWidth": false,
            "pageLength": 25,
            "ajax": host + "/games/getGames",
            "columns": [{
                "data": "_id"
            }, {
                "data": "name"
            }, {
                "data": "action",
                render: function(data, type, row) {
                    return '<img class="brand-img mr-10" src="/uploads/' + row.theme_bg + '" height="90px" />';
                }
            }, {
                "data": "action",
                render: function(data, type, row) {
                    return '<img class="brand-img mr-10" src="/uploads/' + row.theme_icon + '" height="90px" />';
                }
            }, {
                "data": "action",
                render: function(data, type, row) {
                    return '<img class="brand-img mr-10" src="/uploads/' + row.reel_bg + '" height="90px" />';
                }
            }, {
                "data": "action",
                render: function(data, type, row) {
                    return '<img class="brand-img mr-10" src="/uploads/' + row.reel_frame + '" height="90px" />';
                }
            }, {
                "data": "action",
                render: function(data, type, row) {
                    console.log("row",row);
                    return '<div class="dropdown show"><a class="btn btn-primary btn-xs btn-rounded" title="View Symbol" href="/symbolManagement/' + row._id + '"><i class="fa fa-eye" aria-hidden="true"></i></a> <a class="btn btn-warning btn-xs btn-rounded" href="/games/gameEdit/' + row._id +'"><i class="fa fa-edit" aria-hidden="true"></i></a> <a class="btn btn-danger btn-xs btn-rounded delete" id="'+row._id+'"><i class="fa fa-trash" aria-hidden="true"></i></a></div>';//{%if (roleData[2] == "delete") or (role == "admin")%}<button type="button" title="Delete Player" name="delete" id="' + row.id + '" class="btn btn-danger btn-xs btn-rounded delete"><i class="fa fa-trash" aria-hidden="true"></i></button>{%endif%}
                }
            }]
        });
        $(function() {
            "use strict";

            var SweetAlert = function() {};

            SweetAlert.prototype.init = function() {

                    //Parameter

                    $('body').on('click', '.delete', function(e) {
                        var id = $(this).attr('id');
                        var thisElement = this;
                        swal({
                            title: "Are you sure?",
                            text: "You will not be able to recover this game!",
                            type: "warning",
                            showCancelButton: true,
                            confirmButtonColor: "#e69a2a",
                            confirmButtonText: "Yes",
                            cancelButtonText: "No",
                            closeOnConfirm: false,
                            closeOnCancel: false
                        }, function(isConfirm) {
                            if (isConfirm) {
                                $.ajax({
                                    type: 'POST',
                                    url: host + "/games/gameDelete",
                                    data: {
                                        id: id
                                    },
                                    success: function(resultData) {
                                        // alert(resultData)
                                        console.log(resultData);
                                        if (resultData == 'success') {
                                           $('.confirm').click(function(){ 
                                           window.location.reload()
                                        })
                                        } else {
                                            alert("Something went wrong")
                                        }
                                        // alert("Save Complete")
                                    }
                                });
                                swal("Deleted!", "Theme Deleted Succesfully.", "success");
                            } else {
                                swal("Cancelled", "Theme Not Deleted)", "error");
                            }
                        });
                        return false;
                    });
                },
                $.SweetAlert = new SweetAlert, $.SweetAlert.Constructor = SweetAlert;

            $.SweetAlert.init();
        });
    });
</script>
{% endblock %}
