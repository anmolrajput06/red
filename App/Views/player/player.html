{% extends "partition/layout.html" %} {% block body %}

<!-- Main Content -->
<div class="page-wrapper">
    <div class="container-fluid">
        <!-- Title -->
        <section class="content-header">
            <h1>Player Table</h1>
            <ol class="breadcrumb">
                <li><a href="#"><i class="fa fa-dashboard"></i> Dashboard</a></li>
                <li class="active" href="/player">Player</li>
            </ol>
        </section>
        <!-- /Title -->
         
        <!-- Row -->
        <section class="content">
            <div class="row">
                <div class="col-sm-12">
                    <div class="panel panel-default card-view">
                        <div class="panel-heading">
                            <div class="pull-left">
                                <h6 class="panel-title txt-dark">Players</h6>
                            </div>
                            <!-- <div class="pull-right">
                                <a href="/addPlayer"><button type="button" class="btn btn-primary btn-md"><i class="fa fa-plus"></i> Add Player</button></a>
                            </div> -->
                            <div class="clearfix"></div>
                        </div>
                        <div class="panel-wrapper collapse in">
                            <div class="panel-body">
                                <div class="table-wrap">
                                    <div class="table-responsive">
                                        <table id="myTable" class="table table-bordered table-striped">
                                            <thead>
                                                <tr>
                                                    <th>Sr No.</th>
                                                    <th>User Name</th>
                                                    <th>Email</th>
                                                    <!-- <th>Login Code</th> -->
                                                    <th>Cash</th>
                                                    <th>Status</th>
                                                    <th>Guest Player</th>
                                                    <th>Action</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
<section class="content">
    <!-- Row -->
    <div class="row">
        <!-- /.modal -->
        <div id="responsive-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true" style="display: none;">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form method="POST" name="adduser" action="/player/chipsAdd">
                        <div class="modal-header">
                            <button type="button" class="close" data-dismiss="modal" aria-hidden="true">×</button>
                            <h5 class="modal-title">Add/Deduct Coins</h5>
                        </div>
                        <div class="modal-body">
                            <div id="chipsAdd"> </div>
                            <div class="form-group">
                                <label for="recipient-name" class="control-label mb-10">Chips:</label>
                                <input type="text" name="chips" class="form-control" id="recipient-name" required>
                            </div>

                        </div>
                        <div class="modal-footer">
                            <input type="submit" name="chipsValue" class="btn btn-success" value="Add">
                            <input type="submit" class="btn btn-danger" name="chipsValue" value="Deduct">
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <!-- Button trigger modal -->
    </div>
    <!-- /Row -->
</section>

{% endblock %} {% block Jscript %}
<script>
    $(document).ready(function() {
        var host = window.location.origin;
        let ajaxUrl = host + "/player/getPlayer";
        let ajaxExportUrl = host + "/player/getPlayer?export=all";
        let isAllPlayers = "{{allPlayers  }}";
        if (isAllPlayers == 'true') {
            ajaxUrl = host + "/player/getAllPlayers";
            ajaxExportUrl = host + "/player/getAllPlayers?export=all";
        }
        $('#myTable').DataTable({
            "oLanguage": {
                "sSearch": "Search Username"
            },
            "processing": true,
            "serverSide": true,
            "ordering": false,
            "autoWidth": false,
            "pageLength": 10,
            "ajax": ajaxUrl,
            "columns": [{
                "data": "id",
                render: function(data, type, row, meta) {
                    return meta.row + meta.settings._iDisplayStart + 1;
                }
            }, {
                "data": "username"
            }, {
                "data": "email"
            }, {
                "data": "chips"
            }, {
                "data": "status",
                render: function(data, type, row) {
                    if (data == "inactive") {
                        return '<a href="#" class="playerActive" id="' + row.id + '"" style="color:#FF0000;">' + row.status + '</a>'
                    } else if (data == "block") {
                        return '<a href="#" class="playerActive" id="' + row.id + '" style="color:#FF0000;">' + row.status + '</a>'
                    } else {
                        return '<a href="#" class="playerActive" id="' + row.id + '" style="color:#008000;">' + row.status + '</a>'
                    }
                }
            }, {
                "data": "isGuestPlayer"
            }, {
                "data": "action",
                render: function(data, type, row) {
                    return '<a href="#" class="playerActive" ><button type="button" id="' + row.id + '" class="btn btn-warning btn-xs btn-rounded block" name="block" value="block" title="Block Player"><i class="fa fa-ban" aria-hidden="true"></i></button></a> <button type="button" title="Delete Player" name="delete" id="' + row.id + '" class="btn btn-danger btn-xs btn-rounded delete"><i class="fa fa-trash" aria-hidden="true"></i></button> '
                        //<a data-toggle="modal" data-target="#responsive-modal" class="btn btn-default btn-xs addChips btn-rounded" id="' + row.id + '" title="Add Chips"><i class="fa fa-dollar" aria-hidden="true"></i></a> <a href="player/chipsHistory/' + row.id + '" class="btn btn-info btn-xs btn-rounded" title="Cash History"><i class="fa fa-history" aria-hidden="true"></i></a>
                        //<a href="/playerEdit/' + row.id + '"><button type="button" class="btn btn-warning btn-xs btn-rounded" name="edit" title="Edit Player"><i class="fa fa-edit" aria-hidden="true"></i></button></a> <button type="button" title="Delete Player" name="delete" id="' + row.id + '" class="btn btn-danger btn-xs btn-rounded delete"><i class="fa fa-trash" aria-hidden="true"></i></button> <a data-toggle="modal" data-target="#responsive-modal" class="btn btn-default btn-xs addChips btn-rounded" id="' + row.id + '" title="Add Chips"><i class="fa fa-dollar" aria-hidden="true"></i></a> <a href="player/chipsHistory/' + row.id + '" class="btn btn-info btn-xs btn-rounded" title="Cash History"><i class="fa fa-history" aria-hidden="true"></i></a><button type="button" name="active" id="' + row.id + '" class="btn btn-success btn-xs playerActive btn-rounded">' + row.status + '</i></button>
                }
            }]
        });

        $(function() {
            "use strict";

            var SweetAlert = function() {};

            SweetAlert.prototype.init = function() {

                    //Parameter
                    $('body').on('click', '.delete', function(e) {
                        var id = $(this).attr('id');
                        var thisElement = this;
                        swal({
                            title: "Are you sure?",
                            text: "You will not be able to recover this Player!",
                            type: "warning",
                            showCancelButton: true,
                            confirmButtonColor: "#e69a2a",
                            confirmButtonText: "Yes, delete it!",
                            cancelButtonText: "No, cancel plx!",
                            closeOnConfirm: false,
                            closeOnCancel: false
                        }, function(isConfirm) {
                            if (isConfirm) {
                                $.ajax({
                                    type: 'POST',
                                    url: host + "/player/getPlayerDelete",
                                    data: {
                                        id: id
                                    },
                                    success: function(resultData) {
                                        // alert(resultData)
                                        console.log(resultData);
                                        if (resultData == 'success') {
                                            $(thisElement).parent().parent().hide(700);
                                            swal("Deleted!", "Your imaginary file has been deleted.", "success");
                                        } else {
                                            alert("Something went wrong")
                                        }
                                        // alert("Save Complete")
                                    }
                                });
                                swal("Deleted!", "Player Deleted Succesfully.", "success");
                            } else {
                                swal("Cancelled", "Player Not Deleted)", "error");
                            }
                        });
                        return false;
                    });
                    // Active & Deactive

                    $('body').on('click', '.playerActive', function(e) {
                        var id = $(this).attr('id');
                        // var status = $('#block').val()
                        // console.log(status);
                        var thisElement = this;
                        swal({
                            title: "Are you sure?",
                            text: "Do you want to update the status?",
                            type: "warning",
                            showCancelButton: true,
                            confirmButtonColor: "#e69a2a",
                            confirmButtonText: "Yes, Update it!",
                            cancelButtonText: "No, cancel pls!",
                            closeOnConfirm: false,
                            closeOnCancel: false
                        }, function(isConfirm) {
                            if (isConfirm) {
                                $.ajax({
                                    type: 'POST',
                                    url: host + "/player/active",
                                    data: {
                                        id: id,
                                        // status: status
                                    },
                                    success: function(resultData, data) {
                                        console.log(data);
                                        if (resultData == 'success') {
                                            window.location.reload();
                                            // var changeText = 'active';
                                            // if ($(thisElement).parent().parent().find('td  .playerActive').text() == 'active') {
                                            //     changeText = 'inactive';
                                            // }
                                            // console.log($(thisElement).parent().parent().find('td .playerActive').text(changeText));
                                            //$(thisElement).parent().parent().hide(700);
                                            //swal("Update!", "Player Status Updated Successfully..", "success");
                                        } else {
                                            alert("Something went wrong")
                                        }

                                    }
                                });
                                swal("Success!", "Player Status Updated Succesfully.", "success");
                            } else {
                                swal("Cancelled", "Player Status not Updated)", "error");
                            }
                        });
                        return false;
                    });
                    $('body').on('click', '.block', function(e) {
                        var id = $(this).attr('id');
                        console.log(id);
                        var status = $(this).attr('value');
                        console.log(status);
                        var thisElement = this;
                        swal({
                            title: "Are you sure?",
                            text: "Do you want to update the status?",
                            type: "warning",
                            showCancelButton: true,
                            confirmButtonColor: "#e69a2a",
                            confirmButtonText: "Yes, Update it!",
                            cancelButtonText: "No, cancel pls!",
                            closeOnConfirm: false,
                            closeOnCancel: false
                        }, function(isConfirm) {
                            if (isConfirm) {
                                $.ajax({
                                    type: 'POST',
                                    url: host + "/player/active",
                                    data: {
                                        id: id,
                                        status: status
                                    },
                                    success: function(resultData, data) {
                                        console.log(data);
                                        if (resultData == 'success') {
                                            window.location.reload();
                                            // var changeText = 'active';
                                            // if ($(thisElement).parent().parent().find('td  .playerActive').text() == 'active') {
                                            //     changeText = 'inactive';
                                            // }
                                            // console.log($(thisElement).parent().parent().find('td .playerActive').text(changeText));
                                            //$(thisElement).parent().parent().hide(700);
                                            //swal("Update!", "Player Status Updated Successfully..", "success");
                                        } else {
                                            alert("Something went wrong")
                                        }

                                    }
                                });
                                swal("Success!", "Player Status Updated Succesfully.", "success");
                            } else {
                                swal("Cancelled", "Player Status not Updated)", "error");
                            }
                        });
                        return false;
                    });
                },
                $.SweetAlert = new SweetAlert, $.SweetAlert.Constructor = SweetAlert;

            $.SweetAlert.init();
        });

        $("body").on("click", ".addChips", function() {
            var PlayerId = $(this).attr("id");
            // console.log("player id ----------->",PlayerId)
            var html = '<input type="hidden" name="playerId" value="' + PlayerId + '" />';
            $("#chipsAdd").html(html);
        });
    });
</script>
<script type="text/javascript" src="https://cdn.datatables.net/buttons/1.5.2/js/dataTables.buttons.min.js"></script>
<script type="text/javascript" src="https://cdn.datatables.net/buttons/1.5.2/js/buttons.flash.min.js"></script>
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
<script type="text/javascript" src="https://cdn.datatables.net/buttons/1.5.2/js/buttons.html5.min.js"></script>
{% endblock %}
