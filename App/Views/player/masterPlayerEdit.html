{% extends "partition/layout.html" %} {% block body %}


<!-- Main Content -->
<div class="page-wrapper">
    <div class="container-fluid">

        <!-- Title -->
        <section class="content-header">
            <h1>Player table </h1>
            <ol class="breadcrumb">
                <li><a href="myPlayer"><i class="fa fa-users"></i> Player</a></li>
                <li><a href="/grandMaster">Grand Master</a></li>
                <li><a href="/masterPlayerList/{{player.user}}"> Master</a></li>
                {% if player %}
                <li class="active">Edit Player</li>
                {% else %}
                <li class="active">Add Player</li>
                {% endif %}
            </ol>
        </section>
        <!-- /Title -->

        <section class="content">
            <!-- Row -->
            <div class="row">
                <div class="col-sm-12">
                    <div class="panel panel-default card-view">
                        <div class="panel-heading">
                            <div class="pull-left">
                                <h6 class="panel-title txt-dark">Edit Player</h6>
                            </div>
                            <div class="clearfix"></div>
                        </div>
                        <div class="panel-wrapper collapse in">
                            <div class="panel-body">
                                <div class="table-wrap">
                                    <div class="table-responsive">
                                        <form method="POST" action="/playerEditOfMaster/{{player._id}}" name="adduser" class="form-horizontal">
                                            <table border="0" class="table display  pb-30">
                                                <div class="col-sm-6">
                                                    <div class="panel-wrapper collapse in">
                                                        <div class="panel-body">
                                                            <div class="form-group">
                                                                <label class="control-label mb-10 col-sm-2" for="username">Username*</label>
                                                                <div class="col-sm-10">
                                                                    <input type="text" class="form-control" id="username" placeholder="Enter username" required name="username" value="{{player.username}}" data-validation="length alphanumeric" data-validation-length="" data-validation-error-msg="Username is required">
                                                                </div>
                                                            </div>
                                                          
                                                            <!-- <div class="form-group">
                                                                    <label class="control-label mb-10 col-sm-2" for="username">Lastname:</label>
                                                                    <div class="col-sm-10">
                                                                        <input type="text" class="form-control" id="lastname" placeholder="Enter lastname" required name="lastname" value="{{player.lastname}}" data-validation="length alphanumeric" data-validation-length="" data-validation-error-msg="Lastname is required">
                                                                    </div>
                                                                </div> -->
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="col-sm-6">
                                                    <div class="panel-wrapper collapse in">
                                                        <div class="panel-body">
                                                            <!-- <div class="form-group">
                                                                    <label class="control-label mb-10 col-sm-2" for="mobile">Mobile:</label>
                                                                    <div class="col-sm-10">
                                                                        <input type="text" class="form-control" id="mobile" placeholder="Enter mobile" required="" name="mobile" value="{{player.mobile}}" data-validation="number" maxlength="12">
                                                                    </div>
                                                                </div> -->
                                                            <!-- <div class="form-group">
                                                                <label class="control-label mb-10 col-sm-2" for="chips">Cash</label>
                                                                <div class="col-sm-10">
                                                                    <input type="text" class="form-control" id="chips" placeholder="Enter Chips" name="chips" value="{{player.chips}}" min="0">
                                                                </div>
                                                            </div> -->
                                                            <div class="form-group">
                                                                <label class="control-label mb-10 col-sm-2" for="email">Email*</label>
                                                                <div class="col-sm-10">
                                                                    <input type="text" class="form-control" id="email" placeholder="Enter email" required="" name="email" value="{{player.email}}" data-validation="email">
                                                                </div>
                                                            </div>

                                                        </div>
                                                    </div>
                                                </div>
                                                <tr>
                                                    <td colspan="2">
                                                        <div class="pull-right">
                                                            <input type="submit" class="btn btn-success btn-flat" value="submit">
                                                            <a href="/masterPlayerList/{{loginId}}" class="btn btn-danger btn-flat">Cancel</a>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </table>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </section>
        <!-- /Row -->
    </div>
</div>

{% endblock %} {% block Jscript %}
<script>
    $(document).ready(function() {
        var host = window.location.origin;
    });
</script>
{% endblock %}
