{% extends "partition/layout.html" %}

{% block body %}

	<!-- Main Content -->
	<div class="page-wrapper">
		<div class="container-fluid">

			<!-- Title -->
			<section class="content-header">
				<h1>Live Reports</h1>
				<ol class="breadcrumb">
					<li>
						<a href="#">
							<i class="fa fa-dashboard"></i> Dashboard</a>
					</li>
					<li class="active">Live Reports</li>
				</ol>
			</section>
			<!-- /Title -->
			 
			<!-- Row -->
			<section class="content">
				<div class="row">
					<div class="col-sm-12">
						<div class="panel panel-default card-view">
							<div class="panel-heading">
								<div class="row">

									<div class="col-lg-3">
										<div class="form-group">
											<input type="text" class="form-control pull-right" id="reservation" name="range" placeholder="Select Range">
										</div>
									</div>
									{# <div class="col-md-2">
										<div class="form-group">
											<div class="input-group input-group-sm">
												<span class="input-group-addon">Type</span>
												<select id="types" class="form-control ">
													{%for type in types %}
														<option value={{type.name}}>{{type.value}}</option>
														{%endfor%}
													</select>
												</div>
											</div>
										</div> #}
											<div class="form-group col-md-1">
												<a id="submit" class=" addAcBtn ladda-button btn btn-success btn-sm">
													<span>&nbsp;Submit</span></a>
											</div>
												<div class="col-md-4" id="balance_div" style="display: none;">
										<label>Total Balance: </label> <span id="total_balance" style="margin-right: 10px;">0.00</span><br/>
										<label>System Balance: </label> <span id="system_balance" style="margin-right: 10px;">0.00</span>
									</div>
										</div>
									</div>
									<div class="panel-wrapper collapse in">
										<div class="panel-body">
											<div class="table-wrap">
												<div class="table-responsive">
													<input type="hidden" id="gameType"  name="gameType">
													<table id="myTable" class="table table-hover display  pb-30" >
														<thead>
															<tr>
																<th>Date & Time</th>
																<!-- <th>User Id</th> -->
																<th>Username</th>
																<th>Email/Mobile</th>
																<th>Main Chips</th>
																<th>Rake Chips</th>
																<!-- <th>Chips</th> -->
																<th>Role</th>
																
															</tr>
														</thead>
														<tbody></tbody>
													</table>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</section>
				</div>

			{% endblock %}
			{% block Jscript %}

	<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.5.1/moment.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datetimepicker/3.0.0/js/bootstrap-datetimepicker.min.js"></script>	
				<script>
					$(document).ready(function () {
						var host = window.location.origin;
							$('#myTable').dataTable({
							"ordering": false,
							"autoWidth": false,
							"oLanguage": {
								"sSearch": "Username/User Id/Email",
								"sEmptyTable": "No data available"
							},
						});
						today = new Date();
						today.setHours(00, 00, 00, 000);
						var start = moment().subtract(29, 'days');
						var end = moment();	
						$('#reservation').datetimepicker({ format:'YYYY/MM/DD',defaultDate: today})
						$('body').on('click', '#submit', function () {
							$('#myTable').dataTable().fnDestroy();
							var date = $('#reservation').val()
							let startDate= new Date(date)
							let endDate = new Date(date)
							startDate.setHours(00, 00, 00, 000);
							endDate.setHours(23, 59, 59, 999);
							$('#myTable').DataTable({
								"oLanguage": {
									"sSearch": "Username/Email"
								},
								"processing": true,
								"serverSide": true,
								"searching": true,
								"ordering": false,
								"autoWidth": false,
								"pageLength": 100,
									"dom": 'Bfrtip',
								"buttons":['csv', 'excel'],
								"ajax":{
								"type" : "GET",
									"url" :  host + "/liveReports/getData?startDate=" + startDate+ "&endDate=" +endDate,
									"dataSrc": function ( json ) {
										if(json.total_balance){
											$('#total_balance').html(parseFloat(json.total_balance).toFixed(2));
										} else{
											$('#total_balance').html('0.00');
										}
										if(json.system_balance){
											$('#system_balance').html(parseFloat(json.system_balance).toFixed(2));
										} else{
											$('#system_balance').html('0.00');
										}
										$('#balance_div').show();
										return json.data;
									}

									},
								"columns": [
									{	
										"data": "createdAt",
										render: function (data, type, row) {
											let dt = new Date(row.createdAt);
											let date = dt.getDate();
											let month = parseInt(dt.getMonth() + 1);
											let year = dt.getFullYear();
											let hours = dt.getHours();
											let minutes = dt.getMinutes();
											let ampm = hours >= 12
												? 'pm'
												: 'am';
											hours = hours % 12;
											hours = hours
												? hours
												: 12;
											minutes = minutes < 10
												? '0' + minutes
												: minutes;
											let createdAt = year + '/' + month + '/' + date + ' ' + hours + ':' + minutes + ' ' + ampm;
											return createdAt;
										}
									},/* {"data": "userId"}, */
									{
										"data": "username",render: function (data, type, row) {
												return row.username =row.username? row.username : row.firstname || "player"   
												}
									},  {
										"data": "email",render: function (data, type, row) {
											return row.email =row.email ?  row.email : row.mobile || "-"
										}
									},{
										"data": "chips",render: function (data, type, row) {
											return row.chips =row.chips ?  parseFloat(row.chips).toFixed(2) :0
												 
												}
									},{
										"data": "rake_chips",render: function (data, type, row) {
											return row.rake_chips =row.rake_chips ?  parseFloat(row.rake_chips).toFixed(2) :0
												 
												}
									},
									 /* {
										"data": "chips",render: function (data, type, row) {
											return row.chips =row.chips ?  parseFloat(row.chips).toFixed(2) :0
												 
												}
									}, */ {
										"data": "role",render: function (data, type, row) {
												return row.role =row.role? row.role : "player"
												}

									}, 
								]
							});

						});
					});
				</script>
</script>
<script type="text/javascript" src="https://cdn.datatables.net/buttons/1.5.2/js/dataTables.buttons.min.js"></script>
<script type="text/javascript" src="https://cdn.datatables.net/buttons/1.5.2/js/buttons.flash.min.js"></script>
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
<script type="text/javascript" src="https://cdn.datatables.net/buttons/1.5.2/js/buttons.html5.min.js"></script>
			{% endblock %}
