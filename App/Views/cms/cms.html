{% extends "partition/layout.html" %} {% block body %}


<!-- Main Content -->
<div class="page-wrapper">
    <div class="container-fluid">

        <!-- Title -->
        <section class="content-header">
            <h1>CMS Mangement</h1>
            <ol class="breadcrumb">
                <li><a href="/"><i class="fa fa-dashboard"></i>Dashboard</a></li>
                <li><a href="#"><span>CMS Management</span></a></li>
            </ol>
        </section>
        <!-- /Title -->
         
        <!-- Row -->
        <section class="content">
            <div class="row">
                <div class="col-sm-12">
                    <div class="panel panel-default card-view">
                        <div class="panel-heading">
                            <div class="pull-left">
                                <h6 class="panel-title txt-dark">CMS Management</h6>
                            </div>
                            <div class="clearfix"></div>
                        </div>
                        <div class="panel-wrapper collapse in">
                            <div class="panel-body">
                                <div class="table-wrap">
                                    <div class="table-responsive">
                                        <table id="myTable" class="table table-hover display  pb-30">
                                            <thead>
                                                <tr>
                                                    <th>Sr. no.</th>
                                                    <th>CMS Page</th>
                                                    <th>Action</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>

{% endblock %} {% block Jscript %}
<script>
    $(document).ready(function() {
        var host = window.location.origin;
        $('#myTable').DataTable({
            "oLanguage": {
                "sSearch": "Search CMS"
            },
            "processing": true,
            "serverSide": true,
            "ordering": false,
            "autoWidth": false,
            "pageLength": 10,
            "ajax": host + "/getCmsPage",
            "columns": [{
                "data": "id",
                render: function(data, type, full, meta) {
                    return meta.row + 1;
                }
            }, {
                "data": "identifier",
                render: function(data) {
                    if (data == "aboutUs") {
                        return "About Us"
                    } else if (data == "support") {
                        return "Support"
                    } else if (data == "privacyPolicy") {
                        return "Privacy Policy"
                    } else {
                        return "Terms Of Service"
                    }
                }
            }, {
                "data": "action",
                render: function(data, type, row) {
                    console.log(data);
                    console.log(type);
                    console.log(row.identifier);
                    return (row.identifier == "support") ? '<div class="dropdown show">{%if roleData[1] == "edit" or role == "admin"%}<a class="btn btn-warning btn-xs btn-rounded" href="/editCms/' + row.id + '"><i class="fa fa-eye" aria-hidden="true"></i></a>{%endif%} {%if roleData[2]=="delete" or role == "admin"%}<button type="button" title="Delete Cms" name="delete" id="' + row.id + '" class="btn btn-danger btn-xs btn-rounded delete"><i class="fa fa-trash" aria-hidden="true"></i></button>{%endif%}</div>' : '<div class="dropdown show">{%if roleData[1] == "edit" or role == "admin"%}<a class="btn btn-warning btn-xs btn-rounded" href="/editCms/' + row.id + '"><i class="fa fa-edit" aria-hidden="true"></i></a>{%endif%} {%if roleData[2]=="delete" or role == "admin"%}<button type="button" title="Delete Cms" name="delete" id="' + row.id + '" class="btn btn-danger btn-xs btn-rounded delete"><i class="fa fa-trash" aria-hidden="true"></i></button>{%endif%}</div>'
                }
            }]
        });
        $('body').on('click', '.delete', function(e) {
            var id = $(this).attr('id');
            var thisElement = this;
            swal({
                title: "Are you sure?",
                text: "You will not be able to recover this Player!",
                type: "warning",
                showCancelButton: true,
                confirmButtonColor: "#e69a2a",
                confirmButtonText: "Yes, delete it!",
                cancelButtonText: "No, cancel plx!",
                closeOnConfirm: false,
                closeOnCancel: false
            }, function(isConfirm) {
                if (isConfirm) {
                    $.ajax({
                        type: 'POST',
                        url: host + "/getCmsDelete",
                        data: {
                            id: id
                        },
                        success: function(resultData) {
                            // alert(resultData)
                            if (resultData == 'success') {
                                location.reload();
                                swal("Deleted!", "Your imaginary file has been deleted.", "success");
                            } else {
                                alert("Something went wrong")
                            }
                            // alert("Save Complete")
                        }
                    });
                    swal("Deleted!", "CMS Deleted Succesfully.", "success");
                } else {
                    swal("Cancelled", "CMS Not Deleted)", "error");
                }
            });
            return false;
        });
    });
</script>
{% endblock %}
